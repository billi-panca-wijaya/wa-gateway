name: wa-gateway

services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.24.0
    container_name: wa-gateway-openwa
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - '127.0.0.1:18091:2785'
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
      - PORT=2785
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/app/data/openwa.sqlite
      - SESSION_DATA_PATH=/app/data/sessions
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - AUTO_START_SESSIONS=true
      - MESSAGE_RETENTION_DAYS=1
      - UPDATE_CHECK_ENABLED=false
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:2785/api/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      wa-gateway-net:
        aliases:
          - openwa

volumes:
  openwa-data:

networks:
  wa-gateway-net:
    name: wa-gateway-net
