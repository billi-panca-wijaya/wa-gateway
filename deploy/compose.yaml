# WA Gateway (OpenWA) — isolated deployment for VPS /www/docker/wa-gateway/deploy
# Added by the OTP-login integration. Does NOT modify the upstream docker-compose*.yml.
#
# Differences vs upstream docker-compose.yml (intentional, see DECISIONS.prd D08):
# - pinned published image matching the local source version (0.24.0) instead of a local build
# - no docker-socket-proxy and no /var/run/docker.sock: built-in datastore orchestration is unused
# - SQLite on a named volume, host port bound to 127.0.0.1 only (admin access via SSH tunnel)
# - fixed network "wa-gateway-net" so the website backend reaches http://openwa:2785 privately
#
# Usage (from this folder):  docker compose --env-file .env up -d
name: wa-gateway

services:
  openwa:
    image: ${OPENWA_IMAGE:-ghcr.io/rmyndharis/openwa:0.24.0}
    container_name: wa-gateway-openwa
    restart: unless-stopped
    stop_grace_period: 45s
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: ${OPENWA_PIDS_LIMIT:-1024}
    mem_limit: ${OPENWA_MEM_LIMIT:-1536m}
    ports:
      - '127.0.0.1:${WA_GATEWAY_PORT:?set WA_GATEWAY_PORT in .env}:2785'
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-Asia/Jakarta}
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_CACHE_HOME=/tmp/.cache
      - PORT=2785
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/app/data/openwa.sqlite
      - DATABASE_SYNCHRONIZE=false
      - ENGINE_TYPE=${ENGINE_TYPE:-}
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - PLUGINS_DIR=/app/data/plugins
      - AUTO_START_SESSIONS=true
      - REDIS_ENABLED=false
      - QUEUE_ENABLED=false
      - MCP_ENABLED=false
      - ENABLE_SWAGGER=false
      # OTP bodies are stored by the gateway message history; keep the window as short as allowed.
      - MESSAGE_RETENTION_DAYS=${MESSAGE_RETENTION_DAYS:-1}
      - STORE_EPHEMERAL_MESSAGES=false
      - API_MASTER_KEY=${API_MASTER_KEY:-}
      - API_KEY_PEPPER=${API_KEY_PEPPER:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://127.0.0.1:${WA_GATEWAY_PORT}}
      - UPDATE_CHECK_ENABLED=false
      # Dashboard is reached over plain HTTP through an SSH tunnel until a TLS domain exists.
      - CSP_UPGRADE_INSECURE_REQUESTS=${CSP_UPGRADE_INSECURE_REQUESTS:-false}
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:2785/api/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      wa-gateway-net:
        aliases:
          - openwa

volumes:
  openwa-data:

networks:
  wa-gateway-net:
    name: wa-gateway-net
