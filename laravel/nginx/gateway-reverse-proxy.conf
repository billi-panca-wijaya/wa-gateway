# Nginx Configuration for Reverse Proxying Embedded WhatsApp Gateway
# Include this block inside your Laravel server {} block.

# Subrequest auth checking admin session in Laravel
location = /_gateway_auth {
    internal;
    proxy_pass http://127.0.0.1:80/api/v1/admin/gateway-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Content-Type "";
    proxy_set_header Host $http_host;
    proxy_set_header Accept application/json;
    proxy_set_header X-Original-Method $request_method;
}

# Embedded Gateway REST API Proxy
location /gateway-api/ {
    auth_request /_gateway_auth;
    set $openwa http://openwa:2785;
    rewrite ^/gateway-api/(.*)$ /api/$1 break;
    proxy_pass $openwa;
    proxy_http_version 1.1;
    proxy_set_header Host openwa;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header Set-Cookie;
    client_max_body_size 64m;
    proxy_read_timeout 120s;
}

# Embedded Gateway WebSocket Proxy (for live chat & session updates)
location /gateway-socket/ {
    auth_request /_gateway_auth;
    set $openwa http://openwa:2785;
    rewrite ^/gateway-socket/(.*)$ /$1 break;
    proxy_pass $openwa;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host openwa;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
