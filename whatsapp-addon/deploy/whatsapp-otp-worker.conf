; Supervisor example: replace paths and OS user for the host application.
[program:whatsapp-otp-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/your-laravel-app
command=/usr/bin/php artisan queue:work redis --queue=whatsapp-otp --sleep=1 --tries=20 --timeout=60 --max-time=3600
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/your-laravel-app/storage/logs/whatsapp-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
